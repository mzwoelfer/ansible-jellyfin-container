---
- name: Converge
  hosts: all

  tasks:
    - name: Install python3
      ansible.builtin.package:
        name:
          - python3
          - python3-pip
          - python3-dev
          - python3-setuptools
          - python3-wheel
          - python3-apt
        state: present

    - name: Install py stuff to system
      command: rm -f /usr/lib/python3.11/EXTERNALLY-MANAGED

    - name: Install latest pip
      ansible.builtin.command: pip3 install --upgrade pip

    - name: Install ansible
      ansible.builtin.command: pip3 install ansible cryptography

  roles:
    - role: geerlingguy.docker
    - role: mzwoelfer.jellyfin_container
