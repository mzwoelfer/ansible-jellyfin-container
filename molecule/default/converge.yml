---
- name: Bootstrap Python
  hosts: all
  gather_facts: false
  vars: 
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Install python3
      ansible.builtin.raw: apt update && apt install -y python3 python3-pip python3-dev python3-setuptools python3-wheel python3-apt
      become: true

    - name: Install py stuff to system
      command: rm -f /usr/lib/python3.11/EXTERNALLY-MANAGED
      become: true

    - name: Install latest pip
      ansible.builtin.command: pip3 install --upgrade pip
      become: true


    - name: Install ansible
      ansible.builtin.command: pip3 install ansible cryptography
      become: true

- name: Converge
  hosts: all
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  roles:
    - role: geerlingguy.docker
    - role: mzwoelfer.jellyfin_container
