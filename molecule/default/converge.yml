---
- name: Bootstrap Python
  hosts: all
  gather_facts: false
  vars: 
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Install python3
      ansible.builtin.raw: |
        dpkg -s python3 || (apt update && apt install -y python3 python3-pip python3-dev python3-setuptools python3-wheel python3-apt)
      changed_when: false
      become: true

    - name: Install py stuff to system
      ansible.builtin.file:
        path: /usr/lib/python3.11/EXTERNALLY-MANAGED
        state: absent
      become: true

    - name: Install latest pip
      ansible.builtin.pip:
        name: pip
        state: latest
        executable: pip3
      become: true

    - name: Install ansible and cryptography
      ansible.builtin.pip:
        name:
          - ansible
          - cryptography
        state: latest
        executable: pip3
      become: true

- name: Converge
  hosts: all
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  roles:
    - role: geerlingguy.docker
    - role: mzwoelfer.jellyfin_container
